services:
  - type: web
    name: sentinel-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GRANITE_MODE
        value: mock
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PORT
        value: "10000"
    plan: free
    healthCheckPath: /api/v1/health
