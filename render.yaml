services:
  - type: web
    name: sentinel-api
    runtime: python
    buildCommand: "pip install -r requirements-deploy.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GRANITE_MODE
        value: mock
      - key: PYTHON_VERSION
        value: "3.11.7"
    plan: free
    healthCheckPath: /api/v1/health
